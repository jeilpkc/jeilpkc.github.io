    <h3 class="text-xl md:text-2xl font-bold text-slate-900 mb-6 leading-snug">Q5. 광교 풍경채 어바니티 타입별 매물 수량 및 가격 변동 추이</h3>
    
    <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-4">

              class="block w-full sm:w-44 rounded-md border-gray-200 bg-slate-50 text-sm p-2.5 border font-medium focus:border-blue-500 focus:ring-blue-500 text-gray-700">

            <button onclick="switchTab('jeonse')" id="tab-jeonse"

              전세
            </button>
            <button onclick="switchTab('wolse')" id="tab-wolse"
              class="tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm transition">

      <!-- Chart Screen -->

    <div id="mobile-banner-1"></div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Chart Interactive Controller Script -->
  <script>
    // Global State
    let currentTab = 'maemae'; // Options: 'maemae', 'jeonse', 'wolse'
    let currentTypeLabel = null;
    let currentGraphType = 'quantity'; // Default set to 'quantity'
    let chartInstance = null;

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof rawData !== 'undefined' && rawData.length > 0) {
        initializeFilters();
        renderChart();
        updateTabVisibility();
      } else {
        document.getElementById('chart').innerHTML = `
            <div class="text-center p-6 bg-red-50 rounded-lg border border-red-200">
                <p class="text-red-600 text-sm font-semibold">
                    에러: 데이터 원본('rawData')을 찾을 수 없습니다.
                </p>
                <p class="text-xs text-red-500 mt-1">
                    'assets/apartment_data.js' 파일이 정상 경로에 존재하며 유효한 데이터를 포함하고 있는지 점검해 주십시오.
                </p>
            </div>
        `;
      }
    });

    // Parse unique type_labels to populate selector
    function initializeFilters() {
      const selectEl = document.getElementById('typeLabelSelect');
      selectEl.innerHTML = '';

      const uniqueTypes = [...new Set(rawData.map(item => item.type_label))]
        .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }));

      uniqueTypes.forEach(type => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = `${type} 타입`;
        selectEl.appendChild(option);
      });

      // Set default type_label
      if (uniqueTypes.length > 0) {
        currentTypeLabel = String(uniqueTypes[0]);
        selectEl.value = currentTypeLabel;
      }

      // Event listener for type label selection
      selectEl.addEventListener('change', (e) => {
        currentTypeLabel = String(e.target.value);
        updateChartData();
      });

      // Event listener for graph type selection
      document.getElementById('graphTypeSelect').addEventListener('change', (e) => {
        currentGraphType = e.target.value;
        updateTabVisibility();
        updateChartData();
      });
    }

    // Controls the visibility of Maemae/Jeonse/Wolse tabs based on the graph type
    function updateTabVisibility() {
      const tabsWrapper = document.getElementById('tabsContainerWrapper');
      if (tabsWrapper) {
        if (currentGraphType === 'quantity') {
          tabsWrapper.classList.add('hidden');
        } else {
          tabsWrapper.classList.remove('hidden');
        }
      }
    }

    // Helper to safely parse numbers and calculate a true 7-day moving average
    function calculateMovingAverage(seriesData, windowDays = 7) {
      const windowMs = windowDays * 24 * 60 * 60 * 1000;

      return seriesData.map((point, index) => {
        const currentX = point.x;
        let sum = 0;
        let count = 0;

        for (let i = index; i >= 0; i--) {
          if (currentX - seriesData[i].x <= windowMs) {
            const rawVal = seriesData[i].y;

            if (rawVal !== null && rawVal !== undefined && rawVal !== '') {
              const cleanVal = typeof rawVal === 'string'
                ? rawVal.replace(/,/g, '')
                : rawVal;

              const val = parseFloat(cleanVal);

              if (!isNaN(val)) {
                sum += val;
                count++;
              }
            }
          } else {
            break;
          }
        }

        const averageY = count > 0 ? Number((sum / count).toFixed(3)) : null;
        return { x: currentX, y: averageY };
      });
    }

    // Handles changing the active tab and styling the navigation
    function switchTab(tabName) {
      currentTab = tabName;
      const tabs = ['maemae', 'jeonse', 'wolse'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (btn) {
          if (t === tabName) {
            btn.className = "tab-btn border-blue-600 text-blue-600 whitespace-nowrap py-2 px-3 border-b-2 font-semibold text-sm transition";
          } else {
            btn.className = "tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm transition";
          }
        }
      });

      updateChartData();
    }

    // Helper to extract and smooth series data based on selected parameters
    function getFilteredSeriesData() {
      const filteredData = rawData
        .filter(item => String(item.type_label) === String(currentTypeLabel))
        .filter(item => item.timestamp && !isNaN(new Date(item.timestamp).getTime()))
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

      if (currentGraphType === 'price') {
        const minRaw = [];
        const defaultRaw = [];
        const maxRaw = [];

        filteredData.forEach(item => {
          const xVal = new Date(item.timestamp).getTime();
          minRaw.push({ x: xVal, y: item[`${currentTab}_min`] });
          defaultRaw.push({ x: xVal, y: item[`${currentTab}_default`] });
          maxRaw.push({ x: xVal, y: item[`${currentTab}_max`] });
        });
        const minSmoothed = calculateMovingAverage(minRaw, 7);
        const defaultSmoothed = calculateMovingAverage(defaultRaw, 7);
        const maxSmoothed = calculateMovingAverage(maxRaw, 7);
        return [
          { name: '최고가', data: maxSmoothed, color: '#EF4444' },
          { name: '기준가', data: defaultSmoothed, color: '#3B82F6' },
          { name: '최저가', data: minSmoothed, color: '#10B981' }
        ];
      } else {
        // Combined quantity series: Maemae, Jeonse, and Wolse together
        const maemaeQty = [];
        const jeonseQty = [];
        const wolseQty = [];

        filteredData.forEach(item => {
          const xVal = new Date(item.timestamp).getTime();
          maemaeQty.push({ x: xVal, y: item['maemae_qty'] });
          jeonseQty.push({ x: xVal, y: item['jeonse_qty'] });
          wolseQty.push({ x: xVal, y: item['wolse_qty'] });
        });

        return [
          { name: '매매 수량', data: maemaeQty, color: '#3B82F6' }, // Blue
          { name: '전세 수량', data: jeonseQty, color: '#10B981' }, // Green
          { name: '월세 수량', data: wolseQty, color: '#F59E0B' }  // Amber
        ];
      }
    }

    // Creates the base chart instance
    function renderChart() {
      const chartContainer = document.querySelector("#chart");
      if (!chartContainer) return;
      const responsiveHeight = window.innerWidth >= 768 ? 600 : 360;

      const options = {
        series: getFilteredSeriesData(),
        chart: {
          type: 'line',
          height: responsiveHeight,
          fontFamily: 'inherit',
          zoom: {
            enabled: true
          },
          toolbar: {
            show: true
          }
        },
        stroke: {
          curve: 'smooth',
          width: 3
        },
        grid: {
          borderColor: '#f1f1f1',
        },
        xaxis: {
          type: 'datetime',
          labels: {
            datetimeUTC: false,
            format: 'yy-MM-dd'
          },
          title: {
            text: '날짜',
            style: { color: '#6B7280', fontWeight: 600 }
          }
        },
        yaxis: {
          title: {
            text: '수량 (건수)',
            style: { color: '#6B7280', fontWeight: 600 }
          },
          labels: {
            formatter: function (value) {
              return value !== undefined && value !== null
                ? value.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 1 })
                : '';
            }
          }
        },
        tooltip: {
          x: {
            format: 'yyyy-MM-dd'
          }
        }
      };

      chartInstance = new ApexCharts(chartContainer, options);
      chartInstance.render();
      updateChartData();
    }

    // Updates existing chart dynamically, adjusting titles and values as needed
    function updateChartData() {
      if (chartInstance) {
        const isPrice = currentGraphType === 'price';
        const yAxisTitle = isPrice
          ? '금액 (만원 / 월세액)'
          : '수량 (건수)';
        
        const seriesData = getFilteredSeriesData();

        // Extract all valid numeric y-values from the active series to calculate chart boundaries
        const allYValues = seriesData
          .flatMap(series => series.data)
          .map(point => point.y)
          .filter(y => y !== null && y !== undefined && !isNaN(y));

        let calculatedMin = undefined;
        let calculatedMax = undefined;

        if (allYValues.length > 0) {
          const rawMin = Math.min(...allYValues);
          const rawMax = Math.max(...allYValues);

          calculatedMin = rawMin - Math.abs(rawMin) * 0.1;
          calculatedMax = rawMax + Math.abs(rawMax) * 0.1;

          if (calculatedMin < 100) {
            calculatedMin = 0;
          }
        }

        chartInstance.updateOptions({
          series: seriesData,
          yaxis: {
            min: calculatedMin,
            max: calculatedMax,
            title: {
              text: yAxisTitle,
              style: { color: '#6B7280', fontWeight: 600 }
            },
            labels: {
              formatter: function (value) {
                return value !== undefined && value !== null
                  ? value.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 1 })
                  : '';
              }
            }
          }
        });
      }
    }
  </script>
</body>
