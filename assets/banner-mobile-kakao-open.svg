<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Definitions for filters -->
  <defs>
    <filter id="shadow-mobile" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="100" fill="#FFFFFF" rx="8" />

  <!-- Left Graphics (Integrated Buildings + Kakao Icon) -->
  <g transform="translate(10, 0)">
    <!-- Small Building -->
    <rect x="20" y="32" width="15" height="48" rx="2" fill="#CBD5E1"/>
    <!-- Main Building -->
    <rect x="38" y="18" width="18" height="62" rx="2" fill="#475569"/>
    
    <!-- Windows -->
    <circle cx="27" cy="42" r="1" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="27" cy="52" r="1" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="27" cy="62" r="1" fill="#FFFFFF" opacity="0.9"/>
    
    <circle cx="47" cy="28" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="47" cy="38" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="47" cy="48" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="47" cy="58" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="47" cy="68" r="1.2" fill="#FFFFFF" opacity="0.9"/>

    <!-- Overlapping Kakao Icon -->
    <g transform="translate(42, 52) scale(0.65)">
      <path d="M25 0C11.193 0 0 8.954 0 20c0 7.1 4.615 13.364 11.233 16.732l-2.316 8.513c-.15.551.482.98.934.62l10.151-8.113C21.722 39.86 23.336 40 25 40c13.807 0 25-8.954 25-20S38.807 0 25 0z" fill="#FEE500"/>
      <text x="25" y="24" fill="#3C1E1E" font-size="9" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-0.5">TALK</text>
    </g>
  </g>

  <!-- Center Text Information -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="start">
    <text x="115" y="38" fill="#64748B" font-size="11" font-weight="600" letter-spacing="-0.3">광교풍경채</text>
    <text x="115" y="54" fill="#0F172A" font-size="15" font-weight="800" letter-spacing="-0.5">투명공유방</text>
    <text x="115" y="70" fill="#94A3B8" font-size="10" font-weight="500" letter-spacing="-0.3">실시간 입주민 호재·정보 공유</text>
  </g>

  <!-- Right Call To Action Button -->
  <g transform="translate(285, 28)" filter="url(#shadow-mobile)">
    <rect width="95" height="44" rx="22" fill="#FEE500" />
    <text x="47.5" y="26" fill="#191919" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="-0.3">참여하기</text>
  </g>
</svg>