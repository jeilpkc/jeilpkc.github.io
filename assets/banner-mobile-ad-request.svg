<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Definitions for filters and gradients -->
  <defs>
    <filter id="shadow-h" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>

    <linearGradient id="primary-grad-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="100" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1" />

  <!-- Left Graphic Group -->
  <g transform="translate(12, 10)">
    <!-- Building Icons Background -->
    <rect x="5" y="20" width="16" height="55" rx="2" fill="#CBD5E1" opacity="0.6"/>
    <rect x="23" y="10" width="22" height="65" rx="2" fill="#94A3B8" opacity="0.4"/>
    <rect x="47" y="28" width="15" height="47" rx="2" fill="#CBD5E1" opacity="0.6"/>

    <!-- Windows -->
    <rect x="28" y="18" width="4" height="6" fill="#FFFFFF"/>
    <rect x="36" y="18" width="4" height="6" fill="#FFFFFF"/>
    <rect x="28" y="30" width="4" height="6" fill="#FFFFFF"/>
    <rect x="36" y="30" width="4" height="6" fill="#FFFFFF"/>

    <!-- Foreground Badge / Icon Overlay -->
    <g transform="translate(20, 25)" filter="url(#shadow-h)">
      <circle cx="20" cy="20" r="20" fill="#2563EB" />
      <!-- Megaphone Icon -->
      <path d="M12 18 L20 14 L20 26 L12 22 Z" fill="#FFFFFF" />
      <path d="M20 14 L28 10 L28 30 L20 26 Z" fill="#93C5FD" />
      <path d="M30 16 C32 18, 32 22, 30 24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Middle Text Section -->
  <g transform="translate(85, 0)" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 15)">
      <rect width="90" height="18" rx="9" fill="url(#badge-grad)" stroke="#FDE68A" stroke-width="1" />
      <text x="8" y="13" fill="#D97706" font-size="9.5" font-weight="800" letter-spacing="-0.3">공인중개사 대표님</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="52" fill="#0F172A" font-size="12" font-weight="900" letter-spacing="-0.5">부동산 광고주 모집</text>

    <!-- Details / Subtext -->
    <text x="0" y="69" fill="#64748B" font-size="10.5" font-weight="600" letter-spacing="-0.3">광교풍경채 맞춤 홍보</text>
  </g>

  <!-- Right CTA Button Group with Google Form Link -->
  <a href="https://forms.gle/7jatoLRCiNjXbVPb7" target="_blank" style="cursor: pointer; text-decoration: none;">
    <g transform="translate(285, 26)" filter="url(#shadow-h)">
      <rect width="100" height="48" rx="24" fill="url(#primary-grad-h)" />
      <text x="50" y="23" fill="#FFFFFF" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-0.4">광고 제휴</text>
      <text x="50" y="37" fill="#93C5FD" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="-0.3">신청하기 ➔</text>
    </g>
  </a>
</svg>