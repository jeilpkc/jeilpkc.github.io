<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 660" width="100%" height="100%">
  <!-- Definitions for filters and gradients -->
  <defs>
    <filter id="shadow-v" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="160" height="660" fill="#FFFFFF" rx="12" stroke="#E2E8F0" stroke-width="1" />

  <!-- Top Badge / Target Indicator -->
  <g transform="translate(15, 30)">
    <rect width="130" height="26" rx="13" fill="#EFF6FF" />
    <circle cx="15" cy="13" r="5" fill="#2563EB" />
    <text x="25" y="17" fill="#1D4ED8" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="-0.3">공인중개사 전용</text>
  </g>

  <!-- Illustration: Megaphone & Real Estate Building -->
  <g transform="translate(30, 75)">
    <!-- Building Silhouette Background -->
    <rect x="5" y="20" width="22" height="70" rx="2" fill="#94A3B8" opacity="0.3"/>
    <rect x="30" y="5" width="30" height="85" rx="3" fill="#CBD5E1" opacity="0.5"/>
    <rect x="63" y="30" width="20" height="60" rx="2" fill="#94A3B8" opacity="0.3"/>

    <!-- Building Windows -->
    <rect x="36" y="15" width="6" height="8" rx="1" fill="#FFFFFF" />
    <rect x="48" y="15" width="6" height="8" rx="1" fill="#FFFFFF" />
    <rect x="36" y="29" width="6" height="8" rx="1" fill="#FFFFFF" />
    <rect x="48" y="29" width="6" height="8" rx="1" fill="#FFFFFF" />
    <rect x="36" y="43" width="6" height="8" rx="1" fill="#FFFFFF" />
    <rect x="48" y="43" width="6" height="8" rx="1" fill="#FFFFFF" />

    <!-- Megaphone Graphic Floating -->
    <g transform="translate(10, 35) rotate(-10)">
      <path d="M0 12 L18 6 L18 26 L0 20 Z" fill="#2563EB" />
      <path d="M18 6 L38 0 L38 32 L18 26 Z" fill="#3B82F6" />
      <path d="M41 4 C44 10, 44 22, 41 28" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M46 0 C51 9, 51 23, 46 32" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Handle -->
      <path d="M10 18 L14 30 C15 32, 18 32, 19 30 L21 21" fill="#1E293B" />
    </g>
  </g>

  <!-- Divider -->
  <line x1="25" y1="200" x2="135" y2="200" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Typography & Copy -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <!-- Subtitle -->
    <text x="80" y="232" fill="#64748B" font-size="13" font-weight="600" letter-spacing="-0.3">광교풍경채 맞춤</text>
    
    <!-- Main Headline -->
    <text x="80" y="262" fill="#0F172A" font-size="20" font-weight="900" letter-spacing="-0.6">부동산</text>
    <text x="80" y="292" fill="#2563EB" font-size="22" font-weight="900" letter-spacing="-0.6">광고주 모집</text>
    
    <!-- Accent Bar -->
    <rect x="65" y="308" width="30" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Selling Points Card -->
    <g transform="translate(15, 330)">
      <rect width="130" height="120" rx="8" fill="url(#card-bg)" stroke="#E2E8F0" stroke-width="1" />
      
      <!-- Feature 1 -->
      <circle cx="20" cy="25" r="3" fill="#2563EB" />
      <text x="30" y="29" fill="#334155" font-size="10" font-weight="700" text-anchor="start" letter-spacing="-0.3">실수요자 직접 노출</text>

      <!-- Feature 2 -->
      <circle cx="20" cy="60" r="3" fill="#2563EB" />
      <text x="30" y="64" fill="#334155" font-size="10" font-weight="700" text-anchor="start" letter-spacing="-0.3">매수·매도자 타겟</text>

      <!-- Feature 3 -->
      <circle cx="20" cy="95" r="3" fill="#2563EB" />
      <text x="30" y="99" fill="#334155" font-size="10" font-weight="700" text-anchor="start" letter-spacing="-0.3">선착순 한정 제휴</text>
    </g>

    <!-- Google Form Info Text -->
    <text x="80" y="488" fill="#475569" font-size="12" font-weight="700" letter-spacing="-0.3">30초 광고 간편 문의</text>
  </g>

  <!-- CTA Button with Google Form Link -->
  <a href="https://forms.gle/7jatoLRCiNjXbVPb7" target="_blank" style="cursor: pointer; text-decoration: none;">
    <g transform="translate(15, 512)" filter="url(#shadow-v)">
      <rect width="130" height="48" rx="24" fill="url(#primary-grad)" />
      <text x="65" y="28" fill="#FFFFFF" font-size="14" font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-0.4">광고 신청하기</text>
    </g>
  </a>
</svg>